[package]
name = "fastviz"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Fast, minimal photo and video browser for GNOME/Wayland"
license = "GPL-3.0-or-later"
authors = ["WastedLookz <231484447+WastedLookz@users.noreply.github.com>"]
repository = "https://github.com/WastedLookz/FastViz"
homepage = "https://github.com/WastedLookz/FastViz"
readme = "README.md"
publish = false

[dependencies]
# Feature flags match the system libraries on Zorin 18 / Ubuntu 24.04:
# GTK 4.14.5 and libadwaita 1.5.0.
gtk = { package = "gtk4", version = "0.11", features = ["v4_14"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_5"] }
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"
async-channel = "2.5.0"
libheif-rs = { version = "3.0.0", default-features = false, features = ["v1_17"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
image = { version = "0.25.10", default-features = false, features = ["png", "gif", "webp", "bmp", "tiff", "jpeg"] }
kamadak-exif = "0.6.1"
imagesize = "0.15.0"
ffmpeg-next = { version = "9.0.0", default-features = false, features = ["codec", "format", "software-scaling"] }

[profile.release]
lto = "thin"

# Release settings in their own folder (target/deb), so the .deb build's
# path remapping doesn't force the everyday release build to recompile.
[profile.deb]
inherits = "release"

# `scripts/build-deb.sh` builds the .deb (with cargo-deb).
[package.metadata.deb]
copyright = "2026, WastedLookz"
section = "graphics"
extended-description = """\
A minimal, very fast photo and video browser for GNOME: a folder tree and a \
thumbnail grid that stays smooth with tens of thousands of files, a persistent \
thumbnail cache, a fullscreen viewer with zoom and preloading, video playback \
with hardware decoding, slideshows and Files-compatible cut, copy and paste."""
depends = "$auto"
assets = [
    ["target/release/fastviz", "usr/bin/", "755"],
    ["data/io.github.wastedlookz.FastViz.desktop", "usr/share/applications/", "644"],
    ["data/io.github.wastedlookz.FastViz.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/io.github.wastedlookz.FastViz.svg", "usr/share/icons/hicolor/scalable/apps/", "644"],
    ["README.md", "usr/share/doc/fastviz/", "644"],
    ["target/release/THIRD-PARTY-LICENSES.txt", "usr/share/doc/fastviz/", "644"],
]
