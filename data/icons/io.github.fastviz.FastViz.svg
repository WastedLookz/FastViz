<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient: Sleek dark theme base -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c3040" />
      <stop offset="100%" stop-color="#11131a" />
    </linearGradient>

    <!-- Shutter Blade Gradients -->
    <!-- Rust / Speed Orange -->
    <linearGradient id="blade1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF512F" />
      <stop offset="100%" stop-color="#DD2476" />
    </linearGradient>
    <!-- Deep System Blue -->
    <linearGradient id="blade2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4776E6" />
      <stop offset="100%" stop-color="#8E54E9" />
    </linearGradient>
    <!-- Vibrant Tech Green -->
    <linearGradient id="blade3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00b09b" />
      <stop offset="100%" stop-color="#96c93d" />
    </linearGradient>
    <!-- Warm Accent -->
    <linearGradient id="blade4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3904F" />
      <stop offset="100%" stop-color="#3B4371" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- App Icon Base (Standard Squircle) -->
  <rect x="40" y="40" width="432" height="432" rx="100" fill="url(#bg)" filter="url(#shadow)" />

  <!-- Dynamic Geometry (Fast/Viz motif) -->
  <!-- We apply a skew to the group to create forward momentum, maintaining a structural 3D-like mesh layout -->
  <g transform="translate(256, 256) scale(1.15) skewX(-15)" filter="url(#shadow)">
    
    <!-- Top right blade -->
    <path d="M 10,-25 L 120,-25 L 10,85 Z" fill="url(#blade1)" opacity="0.95" />
    
    <!-- Bottom left blade -->
    <path d="M -10,25 L -120,25 L -10,-85 Z" fill="url(#blade2)" opacity="0.95" />
    
    <!-- Top left blade -->
    <path d="M -20,-10 L -90,-100 L 20,-100 Z" fill="url(#blade3)" opacity="0.95" />
    
    <!-- Bottom right blade -->
    <path d="M 20,10 L 90,100 L -20,100 Z" fill="url(#blade4)" opacity="0.95" />
    
  </g>

  <!-- Center Lens / Pupil overlay -->
  <circle cx="256" cy="256" r="48" fill="#11131a" />
  <circle cx="256" cy="256" r="28" fill="#00e5ff" />
  
  <!-- Lens Glint -->
  <circle cx="266" cy="246" r="10" fill="#ffffff" opacity="0.85" />
</svg>