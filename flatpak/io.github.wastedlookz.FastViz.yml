# Flatpak manifest. This copy builds the checkout it sits in:
#   flatpak run org.flatpak.Builder --user --install --force-clean \
#     target/flatpak flatpak/io.github.wastedlookz.FastViz.yml
# Not for Flathub: this manifest was written with an AI assistant, and Flathub
# doesn't accept AI-generated or AI-assisted manifests.
# After changing Cargo.lock, regenerate cargo-sources.json with
# flatpak-cargo-generator.py (flatpak/flatpak-builder-tools).
id: io.github.wastedlookz.FastViz
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.llvm22
command: fastviz
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  # GPU rendering and VA-API video decoding
  - --device=dri
  # Video sound
  - --socket=pulseaudio
  # A file browser: any folder on any drive, with cut/copy/paste, rename and
  # Trash, and "Computer" (/) in the folder tree
  - --filesystem=host
  # Phones (MTP) and network shares are browsed through GVfs's folders
  - --filesystem=xdg-run/gvfs
  # Drives and phones in the folder tree, mounting them, and Undo after
  # Move to Trash (restores through trash:///) go through GVfs
  - --talk-name=org.gtk.vfs.*
  - --filesystem=xdg-run/gvfsd
cleanup:
  - /include
  - /lib/pkgconfig
  - /lib/cmake
  - /share/man
  - /share/doc
  - '*.a'
  - '*.la'
modules:
  # HEIC/HEIF photos: the runtime's libheif has no HEVC decoder.
  - name: libde265
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_SDL=OFF
      - -DENABLE_DECODER=OFF
      - -DENABLE_ENCODER=OFF
    sources:
      - type: archive
        url: https://github.com/strukturag/libde265/releases/download/v1.1.3/libde265-1.1.3.tar.gz
        sha256: 554228bd17788c99a7e63b37ab5634722190e6e2bf60c1dcb01cef328e133905

  - name: libheif
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DENABLE_PLUGIN_LOADING=OFF
      - -DWITH_LIBDE265=ON
      - -DWITH_DAV1D=ON
      - -DWITH_AOM_DECODER=OFF
      - -DWITH_AOM_ENCODER=OFF
      - -DWITH_X265=OFF
      - -DWITH_X264=OFF
      - -DWITH_OpenH264_DECODER=OFF
      - -DWITH_LIBSHARPYUV=OFF
      - -DWITH_EXAMPLES=OFF
      - -DWITH_GDK_PIXBUF=OFF
      - -DBUILD_TESTING=OFF
      - -DBUILD_DOCUMENTATION=OFF
    sources:
      - type: archive
        url: https://github.com/strukturag/libheif/releases/download/v1.23.6/libheif-1.23.6.tar.gz
        sha256: 4484346dc5995319dbc11e3a1c35d0a2ec46511ce370900869337fd2c7033125

  # Video playback: libmpv and what it needs beyond the runtime.
  - name: libass
    config-opts:
      - --disable-static
    sources:
      - type: archive
        url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
        sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc

  - name: libplacebo
    buildsystem: meson
    config-opts:
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Dd3d11=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.360.1
        commit: cee9b076f2c63104ccfd497fa79c39a867293ec4

  - name: mpv
    buildsystem: meson
    config-opts:
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dlibarchive=disabled
      - -Dlibbluray=disabled
      - -Ddvdnav=disabled
      - -Dcdda=disabled
      - -Drubberband=disabled
      - -Duchardet=disabled
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dmanpage-build=disabled
      - -Dhtml-build=disabled
      - -Dpdf-build=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413

  - name: fastviz
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/llvm22/bin
      env:
        CARGO_HOME: /run/build/fastviz/cargo
        CARGO_NET_OFFLINE: 'true'
        # bindgen (FFmpeg bindings) needs libclang
        LIBCLANG_PATH: /usr/lib/sdk/llvm22/lib
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/fastviz -t /app/bin/
      - install -Dm644 data/io.github.wastedlookz.FastViz.desktop -t /app/share/applications/
      - install -Dm644 data/io.github.wastedlookz.FastViz.metainfo.xml -t /app/share/metainfo/
      - install -Dm644 data/icons/io.github.wastedlookz.FastViz.svg -t /app/share/icons/hicolor/scalable/apps/
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .flatpak-builder
          - .git
      - cargo-sources.json
